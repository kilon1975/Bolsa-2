name: Claude Code

# Se activa SOLO cuando alguien escribe un comentario en un issue o PR.
# No se ejecuta automáticamente en push, merge ni ningún otro evento.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Permisos mínimos — solo lo necesario para leer código y comentar.
# NO tiene permisos para deployar, acceder a secrets del repo ni ejecutar código arbitrario.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Solo se ejecuta si el comentario menciona @claude
    if: |
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Limitar turnos para evitar ejecuciones largas/costosas
          claude_args: "--max-turns 10"
