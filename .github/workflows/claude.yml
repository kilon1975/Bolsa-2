name: Claude Code

# Solo se activa cuando alguien escribe un comentario en un issue o PR.
# No se ejecuta automáticamente en ningún otro caso.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Permisos mínimos necesarios — solo lectura/escritura de código, PRs e issues.
# NO tiene permisos para ejecutar código, acceder a secrets del repo, ni deployar.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Solo se ejecuta si el comentario menciona @claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Limitar turnos para evitar ejecuciones largas/costosas
          claude_args: "--max-turns 10"
